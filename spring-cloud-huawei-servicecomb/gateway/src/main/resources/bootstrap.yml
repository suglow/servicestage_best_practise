spring:
  application:
    name: gateway
  cloud:
    servicecomb:
      service:
        application: ${CAS_APPLICATION_NAME:demo-application}
        name: ${spring.application.name}
        version: ${CAS_INSTANCE_VERSION:1.0.0}
      discovery:
        address: ${PAAS_CSE_SC_ENDPOINT:http://127.0.0.1:30100}
      config:
        serverAddr: ${PAAS_CSE_CC_ENDPOINT:http://127.0.0.1:30110}
        serverType: kie
        # 启用 fileSource，让 KIE 中 governance.yaml 的内容被 YamlPropertiesFactoryBean 扁平化
        # block scalar (|) 字段会保持为完整 String，供 RouterRuleCache 直接 getProperty() 读取
        fileSource: governance.yaml,application.yaml
      context:
        headerContextMapper:
          X-Gray-Tag: X-Gray-Tag

# 灰度路由规则通过 KIE Config Center 动态推送
# 参见 kie-init/init-route-rules.sh（docker compose up 时自动执行）

logging:
  level:
    org.apache.servicecomb.router: DEBUG
    com.huaweicloud: DEBUG
