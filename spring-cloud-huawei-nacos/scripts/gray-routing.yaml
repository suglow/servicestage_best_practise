servicecomb:
  routeRule:
    product-service: |
      - precedence: 2
        match:
          headers:
            gray-tag:
              exact: "gray"
        route:
          - weight: 100
            tags:
              version: "2.0.0"
      - precedence: 1
        route:
          - weight: 100
            tags:
              version: "1.0.0"
