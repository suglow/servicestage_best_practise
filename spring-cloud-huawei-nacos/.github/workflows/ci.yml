name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate repository
        run: bash check.sh

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start complete demo
        run: docker compose --profile all up -d --build
      - name: Verify all use cases
        run: bash verify.sh
      - name: Print service logs on failure
        if: failure()
        run: docker compose --profile all logs --no-color --tail=300
      - name: Clean up containers
        if: always()
        run: docker compose --profile all down --volumes
